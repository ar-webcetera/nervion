# Проверка подписи CLA при каждом Pull Request.
# Активируется ТОЛЬКО на GitHub (на Gitea не запускается и не мешает).
#
# Как работает:
#   - При открытии PR бот проверяет, подписал ли автор CLA.
#   - Если нет, бот просит оставить комментарий с фразой согласия.
#   - Подписи хранятся в этом же репозитории в файле
#     signatures/version1/cla.json (создаётся автоматически).
#
# Перед включением нужно один раз:
#   1. Settings -> Secrets and variables -> Actions -> добавить секрет
#      PERSONAL_ACCESS_TOKEN (classic PAT с правом repo) для записи подписей.
#      Встроенного GITHUB_TOKEN недостаточно для коммита подписей в репозиторий.
#   2. При желании поменять текст согласия и пути ниже.

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          # Текст, которым контрибьютор подписывает соглашение в комментарии PR:
          custom-notsigned-prcomment: 'Спасибо за вклад! Перед тем как мы сможем принять PR, прочитайте [CLA](../blob/main/CLA.md) и подпишите его, оставив комментарий ровно с таким текстом:'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'Все контрибьюторы подписали CLA. Спасибо!'
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/CHANGE-ME/REPO/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot],renovate[bot]'
