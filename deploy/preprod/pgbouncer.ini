[databases]
nervion_platform = host=postgres port=5432 dbname=nervion_platform pool_size=6
nervion_data_1 = host=postgres port=5432 dbname=nervion_data_1 pool_size=12

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /run/pgbouncer
auth_type = scram-sha-256
auth_file = /run/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 80
default_pool_size = 12
reserve_pool_size = 2
reserve_pool_timeout = 5
server_idle_timeout = 300
server_lifetime = 3600
query_wait_timeout = 30
server_connect_timeout = 10
server_reset_query = DISCARD ALL
server_reset_query_always = 1
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
